name: Daily HI. Pipeline

on:
  schedule:
    # Daily at 6:00 AM UTC (midnight CST / 1:00 AM CDT).
    # Cron does not observe DST, so this drifts by an hour in summer. That is fine.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Ignore the 24h freshness check and re-fetch every company'
        required: false
        default: false
        type: boolean

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DOL_API_KEY: ${{ secrets.DOL_API_KEY }}
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          PIPELINE_LOG: ${{ runner.temp }}/pipeline.log
        run: |
          cd pipeline

          # One path. The only variable is whether we honour the freshness check.
          # Companies with no data are always stale, so new tickers are collected
          # either way — force_refresh exists to re-pull companies that already
          # have fresh files, which also burns the FMP free-tier 250 calls/day.
          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            INCREMENTAL=""
            echo "Force refresh — re-fetching every company"
          else
            # 20h, not 24h. The cron is every 24h and a run takes ~1.5h, so files
            # written during yesterday's run are ~23h old when today's starts —
            # under a 24h threshold they read as "fresh" and the whole run collects
            # nothing. Observed: "Skipped as fresh (<24h): 902" of 904.
            # 20h guarantees the daily never skips, while still protecting a manual
            # re-run an hour later from re-fetching everything and burning the
            # free-tier quotas (Alpha Vantage ~25/day, yfinance throttles).
            INCREMENTAL="--incremental 20"
            echo "Daily run — collecting anything older than 20h"
          fi

          if [ -f data/scores/all_scores.json ]; then
            cp data/scores/all_scores.json data/scores/all_scores_backup.json
            echo "Backed up $(python3 -c "import json; print(len(json.load(open('data/scores/all_scores_backup.json'))))" ) existing companies"
          fi

          # tee to a log the next step can summarize. Per-company exceptions are
          # caught inside collect_all and do not fail this command — that is how a
          # TypeError killed ~25 mid-caps nightly for months while runs stayed green.
          python3 run_all.py --workers 8 $INCREMENTAL 2>&1 | tee "$PIPELINE_LOG"

          if [ -f data/scores/all_scores_backup.json ] && [ -f data/scores/all_scores.json ]; then
            python3 merge_scores.py data/scores/all_scores_backup.json data/scores/all_scores.json data/scores/all_scores.json
            rm data/scores/all_scores_backup.json
          fi

          echo "Regenerating features from merged scores"
          python3 run_all.py --skip-collect --features-only 2>&1 | tee -a "$PIPELINE_LOG"

      - name: Summarize failures
        if: always()
        env:
          PIPELINE_LOG: ${{ runner.temp }}/pipeline.log
          # Fail when a single error message hits this many companies. Grouping
          # beats a percentage: 25 identical errors out of 900 is 2.8% and would
          # pass any percentage gate, but is unambiguously a bug.
          SYSTEMATIC_THRESHOLD: '10'
        run: python3 pipeline/check_errors.py

      - name: Commit and push updated data
        run: |
          set -e
          git config --local user.email "action@github.com"
          git config --local user.name "HI. Pipeline Bot"

          git update-index --assume-unchanged pipeline/data/subsignals/ups.json 2>/dev/null || true
          git update-index --assume-unchanged pipeline/data/subsignals/UPS.json 2>/dev/null || true

          git add -A pipeline/data/

          COMPANY_COUNT=$(python3 -c 'import json; print(len(json.load(open("pipeline/data/scores/all_scores.json"))))')
          COMMIT_MSG="Daily pipeline: $(date +%Y-%m-%d) · ${COMPANY_COUNT} companies"

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "$COMMIT_MSG"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "Push successful on attempt $attempt"
                exit 0
              else
                echo "Push rejected, retrying"
              fi
            else
              echo "Rebase conflict, aborting and retrying"
              git rebase --abort || true
            fi
            sleep 5
          done

          echo "Push failed after 3 attempts"
          exit 1

      # NOTE: this does not deploy. It copies files into deploy/ and echoes.
      # RAILWAY_TOKEN is set but never used, so Railway is redeploying off the
      # git push above. If so this step can be deleted — it copies ~2,200 files
      # nightly for nothing. Confirm before removing.
      - name: Deploy to Railway
        if: success()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          mkdir -p deploy
          cp -r pipeline/data deploy/
          cp pipeline/*.py deploy/
          cp pipeline/requirements.txt deploy/
          cp pipeline/Procfile deploy/ 2>/dev/null || true
          echo "Pipeline data ready for Railway deployment"
