name: Daily HI. Pipeline

on:
  schedule:
    # Daily at 6:00 AM UTC (midnight CST)
    - cron: '0 6 * * *'
    # Quarterly: 1st of Jan/Apr/Jul/Oct at 7:00 AM UTC
    - cron: '0 7 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - quarterly
          - features-only

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DOL_API_KEY: ${{ secrets.DOL_API_KEY }}
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: |
          cd pipeline
          MODE="${{ github.event.inputs.mode || 'daily' }}"

          if [ "${{ github.event.schedule }}" = "0 7 1 1,4,7,10 *" ]; then
            MODE="quarterly"
          fi

          if [ -f data/scores/all_scores.json ]; then
            cp data/scores/all_scores.json data/scores/all_scores_backup.json
            echo "Backed up $(python3 -c "import json; print(len(json.load(open('data/scores/all_scores_backup.json'))))" ) existing companies"
          fi

          if [ "$MODE" = "quarterly" ]; then
            echo "Quarterly run"
            python3 run_all.py --skip-collect --quarterly
          elif [ "$MODE" = "features-only" ]; then
            echo "Features only"
            python3 run_all.py --skip-collect --features-only
          else
            echo "Daily run"
            python3 run_all.py --workers 8 --incremental 24
          fi

          if [ -f data/scores/all_scores_backup.json ] && [ -f data/scores/all_scores.json ]; then
            python3 merge_scores.py data/scores/all_scores_backup.json data/scores/all_scores.json data/scores/all_scores.json
            rm data/scores/all_scores_backup.json
          fi

          echo "Regenerating features from merged scores"
          python3 run_all.py --skip-collect --features-only

      - name: Commit and push updated data
        run: |
          set -e
          git config --local user.email "action@github.com"
          git config --local user.name "HI. Pipeline Bot"

          # Ignore case-sensitivity ghost files (macOS-created lowercase variants)
          git update-index --assume-unchanged pipeline/data/subsignals/ups.json 2>/dev/null || true
          git update-index --assume-unchanged pipeline/data/subsignals/UPS.json 2>/dev/null || true

          # Stage everything we generated this run BEFORE attempting rebase
          # This way, anything modified is staged and rebase has nothing to complain about
          git add -A pipeline/data/

          # Build the commit message
          COMPANY_COUNT=$(python3 -c 'import json; print(len(json.load(open("pipeline/data/scores/all_scores.json"))))')
          COMMIT_MSG="Daily pipeline: $(date +%Y-%m-%d) · ${COMPANY_COUNT} companies"

          # Only commit if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "$COMMIT_MSG"

          # Now rebase onto remote with retry logic
          # Up to 3 attempts to handle race conditions with concurrent pushes
          for attempt in 1 2 3; do
            echo "Push attempt $attempt"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "Push successful on attempt $attempt"
                exit 0
              else
                echo "Push rejected, retrying"
              fi
            else
              echo "Rebase conflict, aborting and retrying"
              git rebase --abort || true
            fi
            sleep 5
          done

          echo "Push failed after 3 attempts"
          exit 1

      - name: Deploy to Railway
        if: success()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          mkdir -p deploy
          cp -r pipeline/data deploy/
          cp pipeline/*.py deploy/
          cp pipeline/requirements.txt deploy/
          cp pipeline/Procfile deploy/ 2>/dev/null || true
          echo "Pipeline data ready for Railway deployment"
